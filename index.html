<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root { --primary: #1b74e4; --bg: #f0f2f5; --card-bg: #fff; --text: #333; --border: #ddd; --label: #555; --danger: #e74c3c; --warning: #f39c12; --success: #27ae60; }
    body.dark-mode { --bg: #18191a; --card-bg: #242526; --text: #e4e6eb; --border: #3e4042; --label: #b0b3b8; }
    body { background: var(--bg); margin: 0; font-family: 'Kantumruy Pro', sans-serif; color: var(--text); transition: 0.3s; padding-bottom: 80px; }
    .top-header { text-align: center; padding: 10px 20px; background: var(--card-bg); font-weight: bold; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .dark-mode-toggle { background: #eee; border: none; padding: 5px 12px; border-radius: 20px; cursor: pointer; font-size: 12px; }
    body.dark-mode .dark-mode-toggle { background: #3a3b3c; color: #fff; }
    .card { background: var(--card-bg); border-radius: 12px; padding: 20px; margin: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 14px; font-weight: bold; margin-bottom: 8px; color: var(--label); }
    input, select, textarea { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--card-bg); color: var(--text); font-size: 16px; box-sizing: border-box; }
    .product-item { display: flex; align-items: center; padding: 12px; border-bottom: 1px solid var(--border); }
    .product-img { width: 60px; height: 60px; object-fit: contain; }
    .qty-input { width: 60px; text-align: center; border: 1px solid var(--primary); border-radius: 6px; padding: 5px; font-weight: bold; }
    .footer-btn-container { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--card-bg); padding: 15px; border-top: 1px solid var(--border); box-sizing: border-box; z-index: 1000; }
    .btn-main { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; background: var(--primary); color: #fff; font-size: 16px; }
    .summary-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 5px; }
  </style>
</head>
<body>

<div class="top-header">
  <span>🛒 Sales Order System</span>
  <button class="dark-mode-toggle" onclick="toggleDarkMode()" id="modeBtn">🌙 Dark</button>
</div>

<!-- Step 1: Customer Info -->
<div id="step1">
  <div class="card">
    <div class="form-group">
      <label>Sales Manager</label>
      <select id="sManager">
        <option value="" disabled selected>ជ្រើសរើស Sales Manager</option>
        <option value="Central (MT-SM-1)">Central (MT-SM-1)</option>
        <option value="Central (MT-SM-2)">Central (MT-SM-2)</option>
        <option value="Central (GT-SM)">Central (GT-SM)</option>
        <option value="North (GT-SM)">North (GT-SM)</option>
        <option value="South (GT-SM)">South (GT-SM)</option>
        <option value="East (GT-SM)">East (GT-SM)</option>
      </select>
    </div>
    <div class="form-group"><label>ឈ្មោះអតិថិជន *</label><input type="text" id="cName" placeholder="បញ្ចូលឈ្មោះ"></div>
    <div class="form-group"><label>លេខទូរស័ព្ទ</label><input type="tel" id="cPhone" placeholder="012 345 678"></div>
  </div>
  <div class="footer-btn-container"><button class="btn-main" onclick="nextStep()">បន្តទៅជ្រើសរើសទំនិញ →</button></div>
</div>

<!-- Step 2: Product Selection -->
<div id="step2" style="display:none;">
  <div id="pList" class="card" style="padding:0; margin-bottom:200px;"></div>
  <div class="footer-btn-container">
    <div class="summary-row"><span>Subtotal:</span> <span id="subTotalUI">$0.00</span></div>
    <div class="summary-row">
      <span>Discount (%):</span> 
      <input type="number" id="discountPercent" value="0" style="width:60px; text-align:center;" oninput="calculateTotal()">
    </div>
    <div style="font-weight:bold; font-size:18px; margin: 10px 0; color: var(--primary);">
      សរុប: <span id="grandTotalUI">$0.00</span>
    </div>
    <button class="btn-main" id="btnSave" onclick="saveOrder()" style="background:#28a745;">រក្សាទុកការបញ្ជាទិញ 🛒</button>
  </div>
</div>

<!-- Step 3: Success & PDF -->
<div id="step3" style="display:none; text-align:center;">
  <div class="card">
    <div style="font-size: 50px;">✅</div>
    <h2>រក្សាទុករួចរាល់!</h2>
    <p>ទិន្នន័យត្រូវបានបញ្ជូនទៅ Google Sheets</p>
  </div>
  <div class="footer-btn-container">
    <button class="btn-main" style="background:#e74c3c; margin-bottom:10px;" id="btnPDF" onclick="downloadPDF()">ទាញយកវិក្កយបត្រ (PDF) 📄</button>
    <button class="btn-main" style="background:#6c757d;" onclick="location.reload()">កម្មង់ថ្មី</button>
  </div>
</div>

<script>
  // Link Web App ថ្មីរបស់អ្នក
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxQJL8I2q5kSmLMF1hIpn62LTPg8zC7fKiCL-CZicq0OEZByvCeJs1yndoPSqNBjEskag/exec";
  
  let products = [], cart = {}, savedId = "";

  function toggleDarkMode() { document.body.classList.toggle('dark-mode'); }
  
  function nextStep() {
    if(!document.getElementById('cName').value || !document.getElementById('sManager').value) return alert('សូមបំពេញព័ត៌មានឱ្យគ្រប់គ្រាន់');
    document.getElementById('step1').style.display='none';
    document.getElementById('step2').style.display='block';
    loadProducts();
  }

  function loadProducts() {
    document.getElementById('pList').innerHTML = "<p style='padding:20px; text-align:center;'>កំពុងទាញយកទំនិញ...</p>";
    fetch(WEB_APP_URL + "?action=getProducts")
      .then(res => res.json())
      .then(data => { products = data; renderProducts(); })
      .catch(err => alert("Error loading products"));
  }

  function renderProducts() {
    document.getElementById('pList').innerHTML = products.map((p, i) => `
      <div class="product-item">
        <img src="${p.image || 'https://via.placeholder.com/50'}" class="product-img">
        <div style="flex:1; margin-left:12px;">
          <b style="font-size:14px;">${p.name}</b><br>
          <span style="color:var(--primary); font-weight:bold;">$${p.price.toFixed(2)}</span>
        </div>
        <input type="number" class="qty-input" placeholder="0" oninput="updateCart(${i}, this.value)">
      </div>`).join('');
  }

  function updateCart(i, q) {
    const p = products[i];
    const qty = parseInt(q);
    if(qty > 0) cart[p.code] = {...p, qty: qty}; else delete cart[p.code];
    calculateTotal();
  }

  function calculateTotal() {
    let sub = 0; 
    Object.values(cart).forEach(item => sub += item.price * item.qty);
    let disc = sub * (parseFloat(document.getElementById('discountPercent').value || 0) / 100);
    document.getElementById('subTotalUI').innerText = "$" + sub.toFixed(2);
    document.getElementById('grandTotalUI').innerText = "$" + (sub - disc).toFixed(2);
  }

  function saveOrder() {
    if(Object.keys(cart).length === 0) return alert('សូមជ្រើសរើសទំនិញយ៉ាងតិច ១');
    const btn = document.getElementById('btnSave'); 
    btn.disabled = true; 
    btn.innerText = "កំពុងរក្សាទុក...";

    const data = { 
      customer: { 
        manager: document.getElementById('sManager').value, 
        name: document.getElementById('cName').value, 
        phone: document.getElementById('cPhone').value 
      },
      items: Object.values(cart), 
      discountPerc: document.getElementById('discountPercent').value 
    };

    fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify(data) })
      .then(res => res.json())
      .then(res => {
        if(res.status === "success") {
          savedId = res.orderId;
          document.getElementById('step2').style.display='none';
          document.getElementById('step3').style.display='block';
        }
      })
      .catch(err => {
        alert("Save failed");
        btn.disabled = false;
        btn.innerText = "រក្សាទុកការបញ្ជាទិញ 🛒";
      });
  }

  function downloadPDF() {
    const btn = document.getElementById('btnPDF');
    const originalText = btn.innerText;
    btn.innerText = "កំពុងបង្កើត PDF...";
    btn.disabled = true;

    const data = { 
      orderId: savedId, 
      customer: { 
        name: document.getElementById('cName').value, 
        phone: document.getElementById('cPhone').value, 
        manager: document.getElementById('sManager').value 
      },
      items: Object.values(cart), 
      subtotal: document.getElementById('subTotalUI').innerText, 
      discountPerc: document.getElementById('discountPercent').value 
    };

    fetch(WEB_APP_URL, { 
      method: "POST", 
      body: JSON.stringify({ action: "generatePDF", data: data }) 
    })
    .then(res => res.json())
    .then(res => {
      const link = document.createElement('a');
      link.href = "data:application/pdf;base64," + res.base64;
      link.download = "Invoice_" + savedId + ".pdf";
      link.click();
      btn.innerText = originalText;
      btn.disabled = false;
    })
    .catch(err => {
      alert("PDF Error");
      btn.innerText = originalText;
      btn.disabled = false;
    });
  }
</script>
</body>
</html>
