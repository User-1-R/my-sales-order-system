<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root { --primary: #1b74e4; --bg: #f0f2f5; --card-bg: #fff; --text: #333; --border: #ddd; --label: #555; --danger: #e74c3c; --warning: #f39c12; --success: #27ae60; }
    body.dark-mode { --bg: #18191a; --card-bg: #242526; --text: #e4e6eb; --border: #3e4042; --label: #b0b3b8; }
    body { background: var(--bg); margin: 0; font-family: 'Kantumruy Pro', sans-serif; color: var(--text); transition: 0.3s; padding-bottom: 80px; }
    .top-header { text-align: center; padding: 10px 20px; background: var(--card-bg); font-weight: bold; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .dark-mode-toggle { background: #eee; border: none; padding: 5px 12px; border-radius: 20px; cursor: pointer; font-size: 12px; }
    body.dark-mode .dark-mode-toggle { background: #3a3b3c; color: #fff; }
    
    .stepper-container { display: flex; align-items: center; background: var(--card-bg); padding: 10px 15px; border-bottom: 1px solid var(--border); position: relative; }
    .back-btn-step { background: #eee; border: none; border-radius: 50%; width: 30px; height: 30px; cursor: pointer; display: none; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; color: #333; margin-right: 10px; }
    body.dark-mode .back-btn-step { background: #3a3b3c; color: #fff; }
    .stepper { display: flex; justify-content: space-between; align-items: center; flex: 1; padding: 10px 10% 10px 5%; position: relative; }
    .stepper::before { content: ''; position: absolute; top: 50%; left: 10%; right: 15%; height: 2px; background: var(--border); z-index: 1; }
    .step-circle { width: 25px; height: 25px; border-radius: 50%; background: var(--border); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; z-index: 2; border: 2px solid var(--card-bg); }
    .step-circle.active { background: var(--primary); }
    
    .card { background: var(--card-bg); border-radius: 12px; padding: 20px; margin: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 14px; font-weight: bold; margin-bottom: 8px; color: var(--label); }
    input, select, textarea { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--card-bg); color: var(--text); font-size: 16px; box-sizing: border-box; outline: none; }
    
    .product-item { display: flex; align-items: center; padding: 12px; border-bottom: 1px solid var(--border); }
    .product-img { width: 65px; height: 65px; object-fit: contain; border-radius: 6px; background: #fff; border: 1px solid #eee; }
    .qty-input { width: 65px; text-align: center; border: 1px solid var(--primary); padding: 8px; border-radius: 6px; font-weight: bold; background: var(--bg); color: var(--primary); font-size: 16px; }
    
    .footer-btn-container { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--card-bg); padding: 15px; border-top: 1px solid var(--border); box-sizing: border-box; z-index: 1000; }
    .btn-main { width: 100%; padding: 10px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; background: var(--primary); color: #fff; font-size: 16px; }
    
    .summary-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 5px; font-weight: bold; }
    .grand-total-row { display: flex; justify-content: space-between; font-weight: bold; font-size: 18px; color: var(--primary); margin: 10px 0; border-top: 1px dashed var(--border); padding-top: 10px; }
    
    .stock-tag { font-size: 11px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
    .status-out { color: var(--danger); }
    .status-low { color: var(--warning); }
    .status-ok { color: var(--success); }
  </style>
</head>
<body>

<div class="top-header">
  <span>🛒 Sales Order System</span>
  <button class="dark-mode-toggle" onclick="toggleDarkMode()" id="modeBtn">🌙 Dark</button>
</div>

<div class="stepper-container">
  <button id="backBtn" class="back-btn-step" onclick="prevStep()">‹</button>
  <div class="stepper">
    <div id="step-c-1" class="step-circle active">1</div>
    <div id="step-c-2" class="step-circle">2</div>
    <div id="step-c-3" class="step-circle">3</div>
  </div>
</div>

<div id="step1">
  <div class="card">
    <div class="form-group">
      <label>Sales Manager</label>
      <select id="sManager">
        <option value="" disabled selected>ជ្រើសរើស Sales Manager</option>
        <option value="Central (MT-SM-1)">Central (MT-SM-1)</option>
        <option value="Central (MT-SM-2)">Central (MT-SM-2)</option>
        <option value="Central (GT-SM)">Central (GT-SM)</option>
        <option value="North (GT-SM)">North (GT-SM)</option>
        <option value="South (GT-SM)">South (GT-SM)</option>
        <option value="East (GT-SM)">East (GT-SM)</option>
      </select>
    </div>
    <div class="form-group"><label>ឈ្មោះអតិថិជន *</label><input type="text" id="cName" placeholder="បញ្ចូលឈ្មោះអតិថិជន"></div>
    <div class="form-group"><label>លេខទូរស័ព្ទ</label><input type="tel" id="cPhone" placeholder="012 345 678" inputmode="tel"></div>
    <div class="form-group"><label>អាសយដ្ឋាន</label><textarea id="cAddress" rows="3" placeholder="បញ្ចូលអាសយដ្ឋាន"></textarea></div>
  </div>
  <div class="footer-btn-container"><button class="btn-main" onclick="nextStep(2)">បន្តទៅជ្រើសរើសផលិតផល →</button></div>
</div>

<div id="step2" style="display:none;">
  <div id="pList" class="card" style="padding:0; margin-bottom:230px;"></div>
  <div class="footer-btn-container">
    <div class="summary-row">
      <span>Subtotal: <span id="subTotalUI">$0.00</span></span>
      <span>VAT (10%): <span id="vatUI">$0.00</span></span>
    </div>
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <span style="font-size:14px; color:orange; font-weight:bold;">Incentive / Discount (%):</span>
      <input type="number" id="discountPercent" value="0" inputmode="decimal" style="width:75px; padding:6px; text-align:center; font-weight:bold;" oninput="calculateTotal()">
    </div>
    <div class="grand-total-row"><span>សរុបចុងក្រោយ:</span><span id="grandTotalUI">$0.00</span></div>
    <button class="btn-main" style="background:#28a745;" id="btnSave" onclick="saveOrder()">រក្សាទុកការបញ្ជាទិញ 🛒</button>
  </div>
</div>

<div id="step3" style="display:none; text-align:center;">
  <div class="card">
    <div style="font-size: 60px; margin-bottom:10px;">✅</div>
    <h2>ជោគជ័យ!</h2><p style="color:gray;">ការបញ្ជាទិញត្រូវបានរក្សាទុកក្នុង Sheet</p>
  </div>
  <div class="footer-btn-container">
    <button class="btn-main" style="background:#e74c3c; margin-bottom:10px;" onclick="downloadPDF()">ទាញយក PDF 📄</button>
    <button class="btn-main" style="background:#6c757d;" onclick="resetForm()">កម្មង់ថ្មី</button>
  </div>
</div>

<script>
  let products = [], cart = {}, savedId = "";
  
  // ១. ដាក់ Link របស់ Google Web App របស់អ្នកនៅទីនេះ
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyXUykBrVBU-664oKRLCSoqS49cKBop5-5q76yW2u_UyAp6YtTTgvsd3NtbicrMW5Y_uQ/exec";

  function toggleDarkMode() {
    document.body.classList.toggle('dark-mode');
    document.getElementById('modeBtn').innerText = document.body.classList.contains('dark-mode') ? "☀️ Light" : "🌙 Dark";
  }

  function nextStep(step) {
    if(!document.getElementById('sManager').value || !document.getElementById('cName').value) return alert('សូមបំពេញ Sales Manager និងឈ្មោះអតិថិជន');
    document.getElementById('step1').style.display='none';
    document.getElementById('step2').style.display='block';
    document.getElementById('backBtn').style.display='flex';
    document.getElementById('step-c-2').classList.add('active');
    if(products.length === 0) loadProducts();
  }

  function prevStep() {
    document.getElementById('step2').style.display='none';
    document.getElementById('step1').style.display='block';
    document.getElementById('backBtn').style.display='none';
    document.getElementById('step-c-2').classList.remove('active');
  }

  function loadProducts() {
    document.getElementById('pList').innerHTML = "<p style='text-align:center; padding:30px;'>កំពុងទាញយកទិន្នន័យ...</p>";
    
    fetch(WEB_APP_URL + "?action=getProducts")
    .then(res => res.json())
    .then(data => {
      products = data;
      renderProducts();
    })
    .catch(err => alert("កំហុសក្នុងការទាញយកទិន្នន័យផលិតផល"));
  }

  function renderProducts() {
    document.getElementById('pList').innerHTML = products.map((p, i) => {
      const currentQty = cart[p.code] ? cart[p.code].qty : "";
      let stockStatus = "";
      let stockVal = parseInt(p.stock);
      
      if (stockVal <= 0) {
        stockStatus = `<span class="stock-tag status-out">Out Stock</span>`;
      } else if (stockVal <= 50) {
        stockStatus = `<span class="stock-tag status-low">Low Stock (${p.stock})</span>`;
      } else {
        stockStatus = `<span class="stock-tag status-ok">Available (${p.stock})</span>`;
      }

      return `
        <div class="product-item">
          <img src="${p.image || 'https://via.placeholder.com/60'}" class="product-img">
          <div style="flex:1; margin-left:12px;">
            <b style="font-size:13px; display:block; margin-bottom:2px;">[${p.code}] ${p.name}</b>
            <span style="color:var(--primary); font-weight:bold;">$${p.price.toFixed(2)}</span>
            <div style="margin-top:2px;">${stockStatus}</div>
          </div>
          <input type="number" class="qty-input" placeholder="0" inputmode="numeric" value="${currentQty}" oninput="updateCart(${i}, this.value)">
        </div>`;
    }).join('');
  }

  function updateCart(idx, qty) {
    const p = products[idx]; const q = parseInt(qty) || 0;
    if(q > 0) cart[p.code] = { ...p, qty: q }; else delete cart[p.code];
    calculateTotal();
  }

  function calculateTotal() {
    let sub = 0; 
    Object.values(cart).forEach(item => sub += item.price * item.qty);
    let vat = sub * 0.10;
    let totalWithVat = sub + vat;
    let discPerc = parseFloat(document.getElementById('discountPercent').value) || 0;
    let discountCash = totalWithVat * (discPerc / 100);
    let finalTotal = totalWithVat - discountCash;

    document.getElementById('subTotalUI').innerText = "$" + sub.toFixed(2);
    document.getElementById('vatUI').innerText = "$" + vat.toFixed(2);
    document.getElementById('grandTotalUI').innerText = "$" + finalTotal.toFixed(2);
  }

  function saveOrder() {
    if(Object.keys(cart).length === 0) return alert('សូមជ្រើសរើសទំនិញយ៉ាងតិច ១');
    const btn = document.getElementById('btnSave');
    btn.innerText = "កំពុងរក្សាទុក..."; btn.disabled = true;

    const data = { 
      customer: { 
        manager: document.getElementById('sManager').value, 
        name: document.getElementById('cName').value, 
        phone: document.getElementById('cPhone').value, 
        address: document.getElementById('cAddress').value 
      }, 
      items: Object.values(cart), 
      discountPerc: document.getElementById('discountPercent').value 
    };

    fetch(WEB_APP_URL, {
      method: "POST",
      body: JSON.stringify(data)
    })
    .then(res => res.json())
    .then(res => {
      if(res.status === "success") {
        savedId = res.orderId;
        document.getElementById('step2').style.display='none';
        document.getElementById('step3').style.display='block';
        document.getElementById('backBtn').style.display='none';
        document.getElementById('step-c-3').classList.add('active');
      }
    })
    .catch(err => {
      alert("Error: " + err);
      btn.innerText = "រក្សាទុកការបញ្ជាទិញ 🛒";
      btn.disabled = false;
    });
  }

  function downloadPDF() {
    // សម្រាប់ PDF អ្នកអាចប្រើមុខងារនេះ ប្រសិនបើមានក្នុង Google Script
    alert("មុខងារ PDF កំពុងដំណើរការ...");
  }

  function resetForm() {
    location.reload();
  }
</script>
</body>
</html>
